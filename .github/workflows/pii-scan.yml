name: PII and secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (full history, secrets + PII rules)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

      - name: Commit identities are GitHub noreply addresses
        run: |
          bad=$(git log --all --format='%ae%n%ce' | sort -u | grep -v -E '@users\.noreply\.github\.com$|^noreply@github\.com$|^noreply@anthropic\.com$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Commits use non-noreply email addresses:"
            echo "$bad" | sed 's/^\(.\).*@/\1***@/'
            exit 1
          fi
